<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="8"/>
  <ellipse cx="256" cy="256" rx="90" ry="180" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="8"/>
  <line x1="76" y1="256" x2="436" y2="256" stroke="rgba(255,255,255,0.2)" stroke-width="8"/>
  <!-- Central Letters A and ع -->
  <g filter="url(#shadow)" fill="#ffffff" font-family="sans-serif" font-weight="900">
    <text x="160" y="320" font-size="160" text-anchor="middle">A</text>
    <text x="350" y="320" font-size="160" text-anchor="middle" font-family="'Alexandria', sans-serif">ع</text>
  </g>
</svg>
